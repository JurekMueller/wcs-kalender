extend type Query {
  event(id: ID!): Event
  events(filter: EventFilterInput, sort: EventSortInput): [Event!]!
}

extend type Mutation {
  createEvent(input: CreateEventInput!): Event!
  deleteEvent(id: ID!): Event
}

enum Tag {
  PARTY
  WORKSHOP
}

type Event {
  id: ID!
  title: String!
  description: String
  price: Float
  startTime: DateTime!
  endTime: DateTime
  location: Location!
  contactEmail: String!
  hyperlink: String
  imageURL: String
  tags: [Tag!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateEventInput {
  title: String!
  description: String
  price: Float
  startTime: DateTime!
  endTime: DateTime
  adhocLocation: CreateAdhocLocationInput
  venueId: Int
  contactEmail: String!
  tags: [Tag!]!
  hyperlink: String
  imageURL: String
}

enum EventSortField {
  START_TIME
  END_TIME
}

input EventSortInput {
  field: EventSortField!
  direction: SortDirection! = ASC
}

input EventFilterInput {
  startTimeGte: DateTime
  startTimeLte: DateTime
}
